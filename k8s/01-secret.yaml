# ★ 배포 전 반드시 값을 변경하세요
# base64 인코딩: echo -n "값" | base64
# 디코딩 확인:   echo "base64값" | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: vuln-portal-secret
  namespace: vuln-portal
type: Opaque
stringData:
  # DB 접속 정보
  POSTGRES_PASSWORD: "Kcb1234!DB"          # ★ 변경 필요
  DATABASE_URL: "postgresql://vulnportal:Kcb1234!DB@vuln-portal-postgres:5432/vulnportal"

  # 세션 서명 키 (32자 이상 랜덤 문자열)
  AUTH_SECRET: "change-this-secret-min-32-characters!!"   # ★ 변경 필요

  # 외부 API 키 (선택사항 — 없으면 해당 수집기 비활성화)
  NVD_API_KEY: ""
  VULNCHECK_API_KEY: ""

  # 로컬 LLM 설정 (폐쇄망 내부 서버)
  OPENAI_BASE_URL: ""        # 예: http://ollama-service:11434/v1
  OPENAI_API_KEY: ""         # 로컬 LLM은 임의 문자열 가능
  OPENAI_MODEL: ""           # 예: llama3.2
